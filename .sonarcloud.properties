# SonarCloud Automatic Analysis configuration
# Bỏ qua thư mục build, asset tĩnh, CLI scripts và file mockServiceWorker do MSW tự sinh
sonar.exclusions=**/dist/**,**/build/**,**/node_modules/**,image/**,**/mockServiceWorker.js,**/public/mockServiceWorker.js,services/api/scripts/**

# Bỏ qua kiểm tra trùng lặp mã (CPD) cho file CSS và boilerplate Theme
sonar.cpd.exclusions=**/*.css,apps/**/theme/**
